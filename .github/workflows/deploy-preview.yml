name: Deploy PR preview

on:
  workflow_run:
    workflows: ['Deploy to Cloudflare Pages']
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudflare-pages-preview-${{ github.event.workflow_run.pull_requests[0].number || 'none' }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy PR preview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0].number != null
    permissions:
      actions: read
      contents: read
      deployments: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: pages-preview-${{ github.event.workflow_run.pull_requests[0].number }}
          path: dist

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=energy-replay --branch=pr-${{ github.event.workflow_run.pull_requests[0].number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment preview URL on pull request
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          IMMUTABLE_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const previewUrl = process.env.PREVIEW_URL;
            const immutableUrl = process.env.IMMUTABLE_URL;
            const body = [
              marker,
              '## Cloudflare Pages preview',
              '',
              `Preview: ${previewUrl ? `[Open preview](${previewUrl})` : 'URL unavailable'}`,
              immutableUrl && immutableUrl !== previewUrl
                ? `\nImmutable deployment: [Open deployment](${immutableUrl})`
                : '',
              '',
              `Updated for commit \`${context.payload.workflow_run.head_sha.slice(0, 7)}\`.`,
            ].join('\n');

            const issueNumber = context.payload.workflow_run.pull_requests[0].number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
