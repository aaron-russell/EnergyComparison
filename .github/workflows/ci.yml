name: Quality checks
on: [push, pull_request]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Formatting and lint
    uses: ./.github/workflows/quality-checks.yml

  coverage:
    name: Unit tests and coverage
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/coverage.yml

  build:
    name: Production build and site checks
    uses: ./.github/workflows/build.yml

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dependency-review.yml

  browser-e2e:
    name: Browser workflows
    needs: build
    uses: ./.github/workflows/browser-e2e.yml

  check:
    name: check
    if: always()
    needs: [quality, coverage, build, dependency-review, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every pipeline job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          E2E_RESULT: ${{ needs.browser-e2e.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$QUALITY_RESULT" != success || "$COVERAGE_RESULT" != success || "$BUILD_RESULT" != success || "$E2E_RESULT" != success ]]; then
            exit 1
          fi
          if [[ "$EVENT_NAME" == pull_request && "$DEPENDENCY_REVIEW_RESULT" != success ]]; then
            exit 1
          fi
