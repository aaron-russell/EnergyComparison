name: Nightly cross-browser E2E

on:
  schedule:
    - cron: '25 4 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-cross-browser
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-browser:
    name: Firefox and WebKit workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-cross-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:e2e:cross-browser
