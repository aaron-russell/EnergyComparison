name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ['Deploy to Cloudflare Pages']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  production:
    name: Deploy production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application and documentation
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=energy-replay
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  preview-build:
    name: Build PR preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application and documentation
        run: npm run build

      - name: Upload preview artifact
        id: deploy
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview-${{ github.event.pull_request.number }}
          path: dist

  preview-deploy:
    name: Deploy PR preview
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Deploy to Cloudflare Pages' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    permissions:
      contents: read
      deployments: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: pages-preview-${{ github.event.workflow_run.pull_requests[0].number }}
          path: dist

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=energy-replay --branch=pr-${{ github.event.workflow_run.pull_requests[0].number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment preview URL on pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          IMMUTABLE_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const previewUrl = process.env.PREVIEW_URL;
            const immutableUrl = process.env.IMMUTABLE_URL;
            const body = [
              marker,
              '## Cloudflare Pages preview',
              '',
              `Preview: ${previewUrl ? `[Open preview](${previewUrl})` : 'URL unavailable'}`,
              immutableUrl && immutableUrl !== previewUrl
                ? `\nImmutable deployment: [Open deployment](${immutableUrl})`
                : '',
              '',
              `Updated for commit \`${context.payload.workflow_run.head_sha.slice(0, 7)}\`.`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.workflow_run.pull_requests[0].number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
