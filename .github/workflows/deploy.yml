name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: [Quality checks]
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  production:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application and documentation
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=energy-replay
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test production site
        id: hosted_smoke
        env:
          SITE_URL: https://energy.russell-tech.co.uk
          EXPECT_NOINDEX: 'false'
        run: node scripts/smoke-hosted-site.mjs

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for hosted browser checks
        run: npx playwright install --with-deps chromium

      - name: Run synthetic browser workflows against production
        id: hosted_browser
        env:
          E2E_BASE_URL: https://energy.russell-tech.co.uk
        run: npm run test:e2e

      - name: Record deployment verification summary
        if: always()
        env:
          SITE_URL: https://energy.russell-tech.co.uk
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          SMOKE_RESULT: ${{ steps.hosted_smoke.outcome }}
          BROWSER_RESULT: ${{ steps.hosted_browser.outcome }}
          JOB_RESULT: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo '### Production deployment verification'
            echo
            echo "- Commit: \`$DEPLOYED_SHA\`"
            echo "- Site: $SITE_URL"
            echo "- Deployment action: $DEPLOY_RESULT"
            echo "- Hosted HTTP smoke: $SMOKE_RESULT"
            echo "- Hosted synthetic browser workflows: $BROWSER_RESULT"
            echo "- Job result: $JOB_RESULT"
            echo "- Provider release checks: not run by this workflow; see [release checks](https://github.com/$REPOSITORY/blob/$DEPLOYED_SHA/docs/operations/release-checks.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  preview-build:
    name: Build PR preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application and documentation
        run: npm run build

      - name: Upload preview artifact
        id: deploy
        uses: actions/upload-artifact@v7
        with:
          name: pages-preview-${{ github.event.pull_request.number }}
          path: dist
